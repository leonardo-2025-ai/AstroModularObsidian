packages:
  - "."

# pnpm 11+ rifiuta i pacchetti pubblicati da meno di 24h (default 1440 minuti).
# Il lockfile di questo sito viene rigenerato con pnpm 9.10.0 (versione usata
# da Cloudflare), che non applica questa policy e può includere versioni
# recentissime. Con 0 il PC locale (pnpm 12) accetta il lockfile.
# pnpm 9 su Cloudflare ignora questa chiave.
minimumReleaseAge: 0

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  # Name-only patterns: an exact name@version misses astro's peer-suffixed
  # lockfile key, so the exemption silently fails. Bare names match reliably.
  - astro
  - pele
  - '@astrojs/markdown-satteri'
  - '@astrojs/mdx'
  - vscode-languageserver-protocol
  - '@astrojs/internal-helpers@0.11.0 || 0.13.0'
  - '@astrojs/markdown-remark@7.3.0 || 7.3.3'
  - '@astrojs/sitemap@3.7.4'
  - '@astrojs/prism@4.1.0'
  - '@astrojs/telemetry@3.4.0'


